[project]
name = "imagegen"
version = "0.2.0"
description = "CLI that runs local MFLUX text-to-image generation and records each run."
requires-python = ">=3.11"
# MFLUX itself is NOT a dependency: it is installed separately as a uv tool
# (`uv tool install --python 3.13 mflux`) and called as a subprocess.
dependencies = ["pillow>=11"]

[project.scripts]
imagegen = "imagegen.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["imagegen", "imagegen.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
